apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: "kuberploy-dns01-production"
  labels:
    app.kubernetes.io/managed-by: "kuberploy"
    kuberploy.io/certificate-issuer-profile: "kuberploy-dns01-production"
  annotations:
    kuberploy.io/certificate-issuer-spec-digest: "sha256:27775296de6f6a8d9a58b13d298f0ad9d81dc1237fa872ed579c419feca8baa9"
    kuberploy.io/certificate-issuer-revision: "1"
spec:
  acme:
    email: "admin@adminchatmate.com"
    server: "https://acme-v02.api.letsencrypt.org/directory"
    privateKeySecretRef:
      name: "kuberploy-dns01-production-account"
    solvers:
      - selector:
          dnsZones:
            - "adminchatmate.com"
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: "kuberploy-cloudflare-dns01"
              key: "apiToken"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "kuberploy-ci-observer-28cd7b3449b4755ce81d"
