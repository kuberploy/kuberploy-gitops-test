apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "b52a481e-ea84-4563-9d97-8e6bc57501b5"
  name: "web"
spec:
  projectId: "df2f110c-550b-4045-8d07-4aab08fcce0f"
  applicationId: "b52a481e-ea84-4563-9d97-8e6bc57501b5"
  environmentId: "e7c5d040-de96-4949-8d00-f1bd30d9db6b"
  delivery:
    mode: image
    registryPull:
      targetId: "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      profileName: "managed-main"
      profileRevision: 1
    release:
      repository: "registry.adminchatmate.com/kuberploy-qualification/projects/df2f110c-550b-4045-8d07-4aab08fcce0f/services/b52a481e-ea84-4563-9d97-8e6bc57501b5/image"
      digest: "sha256:52d89f56eb0b58f2b5c29ea7a2cc1aacf8ea1721d427fd86c2b02cf604f88a97"
  runtime:
    ports:
      -
        containerPort: 8080
        name: "http"
        protocol: "TCP"
        servicePort: 80
    probes:
      liveness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 10
        timeoutSeconds: 2
      readiness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 3
        timeoutSeconds: 2
      startup:
        failureThreshold: 30
        periodSeconds: 2
        tcpSocket:
          port: "http"
        timeoutSeconds: 1
    replicas: 1
    resources:
      limits:
        cpu: "100m"
        memory: "64Mi"
      requests:
        cpu: "10m"
        memory: "16Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"
