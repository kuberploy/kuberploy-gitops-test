apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "d71ab1a7-2afb-4b6e-b244-4bd49fa063ec"
  name: "web"
spec:
  projectId: "2b5d5baf-bf06-4809-a18b-179082054c7b"
  applicationId: "d71ab1a7-2afb-4b6e-b244-4bd49fa063ec"
  environmentId: "f837907c-aba6-4495-b05c-05624a3bd3ec"
  delivery:
    mode: image
    registryPull:
      targetId: "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      profileName: "managed-main"
      profileRevision: 1
    release:
      repository: "registry.adminchatmate.com/kuberploy-qualification/projects/2b5d5baf-bf06-4809-a18b-179082054c7b/services/d71ab1a7-2afb-4b6e-b244-4bd49fa063ec/image"
      digest: "sha256:c03e70afc51eb1aaca48613c04a7319dcf3e0bfda45bc1cf5a4ba499981a7537"
  runtime:
    ports:
      - containerPort: 8080
        name: "http"
        protocol: "TCP"
        servicePort: 80
    probes:
      liveness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 10
        timeoutSeconds: 2
      readiness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 3
        timeoutSeconds: 2
      startup:
        failureThreshold: 30
        periodSeconds: 2
        tcpSocket:
          port: "http"
        timeoutSeconds: 1
    replicas: 1
    resources:
      limits:
        cpu: "100m"
        memory: "64Mi"
      requests:
        cpu: "10m"
        memory: "16Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"
    env:
      - name: RC402_RUNTIME_SECRET
        valueFrom:
          secretBindingRef:
            bindingId: 1cf322a5-af5e-4398-9248-76bff6265ce2
            name: rc402-runtime-c9778075
            key: apiKey
            version: 2
  routes:
    - id: qualification
      host: kuberploy-qualification.adminchatmate.com
      path: /
      port: http
      dns:
        mode: manual
      tls:
        mode: customCertificate
        secretRef:
          bindingId: f257017d-cbcb-4b53-87e6-3070a55eb551
          name: rc402-custom-cert-c9778075
          version: 2
        redirectHttp: true
      middlewareRefs: []
