apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "6da05d06-69ed-48cc-8e58-15a1cd2e2c01"
  name: "clone-source"
spec:
  projectId: "6b1da853-0bf9-436a-b9e7-4744f7a3586e"
  applicationId: "6da05d06-69ed-48cc-8e58-15a1cd2e2c01"
  environmentId: "51fc57b4-c825-4e7c-9f49-7fef2efc83d0"
  delivery:
    mode: image
    release:
      repository: "registry.k8s.io/e2e-test-images/agnhost"
      digest: "sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85"
  runtime:
    args:
      - "netexec"
      - "--http-port=8080"
      - "--udp-port=-1"
    command:
      - "/agnhost"
    ports:
      -
        containerPort: 8080
        name: "http"
        protocol: "TCP"
        servicePort: 80
    replicas: 1
    resources:
      limits:
        cpu: "100m"
        memory: "64Mi"
      requests:
        cpu: "10m"
        memory: "16Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"
