{
  "apiVersion": "config.kuberploy.io/v1alpha1",
  "kind": "AppConfig",
  "metadata": {
    "id": "0775a998-bd93-449d-9d9b-9d2d0e5e0522",
    "name": "web"
  },
  "spec": {
    "applicationId": "0775a998-bd93-449d-9d9b-9d2d0e5e0522",
    "delivery": {
      "mode": "image",
      "registryPull": {
        "profileName": "managed-main",
        "profileRevision": 1,
        "targetId": "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      },
      "release": {
        "digest": "sha256:f887e07f2b691378512b026ccf52b11ad21bb8c7895ac92b2c4140ae6d3c69d0",
        "repository": "registry.adminchatmate.com/kuberploy-qualification/projects/21a12574-8177-418f-b54e-4b1adc4cc301/services/0775a998-bd93-449d-9d9b-9d2d0e5e0522/image"
      }
    },
    "environmentId": "c06912f0-5612-4593-b697-0a1cb12beab2",
    "projectId": "21a12574-8177-418f-b54e-4b1adc4cc301",
    "routes": [
      {
        "dns": {
          "integrationRef": "kuberploy-cloudflare",
          "mode": "externalDns",
          "ttl": 60
        },
        "host": "kuberploy-dns01.adminchatmate.com",
        "id": "dns01",
        "ingressClassName": "traefik",
        "middlewareRefs": [],
        "path": "/",
        "port": "http",
        "tls": {
          "issuerRef": "kuberploy-dns01-production",
          "mode": "letsencrypt",
          "redirectHttp": true
        }
      }
    ],
    "runtime": {
      "ports": [
        {
          "containerPort": 8080,
          "name": "http",
          "protocol": "TCP",
          "servicePort": 80
        }
      ],
      "probes": {
        "liveness": {
          "failureThreshold": 3,
          "httpGet": {
            "path": "/",
            "port": "http",
            "scheme": "HTTP"
          },
          "periodSeconds": 10,
          "timeoutSeconds": 2
        },
        "readiness": {
          "failureThreshold": 3,
          "httpGet": {
            "path": "/",
            "port": "http",
            "scheme": "HTTP"
          },
          "periodSeconds": 3,
          "timeoutSeconds": 2
        },
        "startup": {
          "failureThreshold": 30,
          "periodSeconds": 2,
          "tcpSocket": {
            "port": "http"
          },
          "timeoutSeconds": 1
        }
      },
      "replicas": 1,
      "resources": {
        "limits": {
          "cpu": "100m",
          "memory": "64Mi"
        },
        "requests": {
          "cpu": "10m",
          "memory": "16Mi"
        }
      },
      "strategy": {
        "type": "RollingUpdate"
      },
      "workloadType": "Deployment"
    }
  }
}
