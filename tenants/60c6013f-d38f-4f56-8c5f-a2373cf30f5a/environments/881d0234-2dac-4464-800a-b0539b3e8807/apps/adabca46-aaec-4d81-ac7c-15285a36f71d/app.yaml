apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "adabca46-aaec-4d81-ac7c-15285a36f71d"
  name: "web"
spec:
  projectId: "60c6013f-d38f-4f56-8c5f-a2373cf30f5a"
  applicationId: "adabca46-aaec-4d81-ac7c-15285a36f71d"
  environmentId: "881d0234-2dac-4464-800a-b0539b3e8807"
  delivery:
    mode: image
    registryPull:
      targetId: "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      profileName: "managed-main"
      profileRevision: 1
    release:
      repository: "registry.adminchatmate.com/kuberploy-qualification/projects/60c6013f-d38f-4f56-8c5f-a2373cf30f5a/services/adabca46-aaec-4d81-ac7c-15285a36f71d/image"
      digest: "sha256:d780e05b25ea9e213411c15327d676d41de0e571ae62c0d34d38cc7f6979a4ef"
  runtime:
    ports:
      -
        containerPort: 8080
        name: "http"
        protocol: "TCP"
        servicePort: 80
    probes:
      liveness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 10
        timeoutSeconds: 2
      readiness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 3
        timeoutSeconds: 2
      startup:
        failureThreshold: 30
        periodSeconds: 2
        tcpSocket:
          port: "http"
        timeoutSeconds: 1
    replicas: 1
    resources:
      limits:
        cpu: "100m"
        memory: "64Mi"
      requests:
        cpu: "10m"
        memory: "16Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"
