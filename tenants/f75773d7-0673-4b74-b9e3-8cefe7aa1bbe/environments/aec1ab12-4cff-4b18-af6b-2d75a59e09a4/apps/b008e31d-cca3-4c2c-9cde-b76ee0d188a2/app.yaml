apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "b008e31d-cca3-4c2c-9cde-b76ee0d188a2"
  name: "rc356-oci-app"
spec:
  projectId: "f75773d7-0673-4b74-b9e3-8cefe7aa1bbe"
  applicationId: "b008e31d-cca3-4c2c-9cde-b76ee0d188a2"
  environmentId: "aec1ab12-4cff-4b18-af6b-2d75a59e09a4"
  delivery:
    mode: image
    release:
      repository: "registry.k8s.io/e2e-test-images/agnhost"
      digest: "sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85"
  runtime:
    args:
      - "netexec"
      - "--http-port=8080"
    command:
      - "/agnhost"
    ports:
      -
        containerPort: 8080
        name: "http"
        protocol: "TCP"
        servicePort: 80
    probes:
      liveness:
        failureThreshold: 6
        httpGet:
          path: "/healthz"
          port: "http"
        periodSeconds: 10
        timeoutSeconds: 2
      readiness:
        failureThreshold: 12
        httpGet:
          path: "/healthz"
          port: "http"
        periodSeconds: 5
        timeoutSeconds: 2
    replicas: 1
    resources:
      limits:
        cpu: "250m"
        memory: "128Mi"
      requests:
        cpu: "25m"
        memory: "32Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"
