{
  "apiVersion": "config.kuberploy.io/v1alpha1",
  "kind": "AppConfig",
  "metadata": {
    "id": "3e52dd75-373c-43d4-968a-60f82b977df6",
    "name": "web"
  },
  "spec": {
    "applicationId": "3e52dd75-373c-43d4-968a-60f82b977df6",
    "delivery": {
      "mode": "image",
      "registryPull": {
        "profileName": "managed-main",
        "profileRevision": 1,
        "targetId": "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      },
      "release": {
        "digest": "sha256:48a3293b0a9a8148c4c51aefeb94938a6e869c4b1304a3fbaf605b4f6414ef2b",
        "repository": "registry.adminchatmate.com/kuberploy-qualification/projects/b37ebcc8-2087-4952-b2f0-8b8e530fcc42/services/3e52dd75-373c-43d4-968a-60f82b977df6/image"
      }
    },
    "environmentId": "05d5eec1-de36-4063-a3d4-27b73a7497c8",
    "overrides": {
      "deployment": {
        "metadata": {
          "annotations": {
            "qualification.kuberploy.io/deployment": "rc414"
          }
        },
        "spec": {
          "revisionHistoryLimit": 7
        }
      },
      "ingress": {
        "metadata": {
          "annotations": {
            "external-dns.alpha.kubernetes.io/cloudflare-proxied": "true",
            "external-dns.alpha.kubernetes.io/target": "103.117.151.86",
            "qualification.kuberploy.io/ingress": "rc414"
          }
        }
      },
      "service": {
        "metadata": {
          "annotations": {
            "qualification.kuberploy.io/service": "rc414"
          }
        },
        "spec": {
          "sessionAffinity": "None"
        }
      },
      "serviceAccount": {
        "metadata": {
          "annotations": {
            "eks.amazonaws.com/role-arn": "arn:aws:iam::123456789012:role/kuberploy-rc414"
          }
        }
      }
    },
    "projectId": "b37ebcc8-2087-4952-b2f0-8b8e530fcc42",
    "routes": [
      {
        "dns": {
          "integrationRef": "kuberploy-cloudflare",
          "mode": "externalDns",
          "ttl": 60
        },
        "host": "kuberploy-app-test.adminchatmate.com",
        "id": "dns01",
        "ingressClassName": "traefik",
        "middlewareRefs": [],
        "path": "/",
        "port": "http",
        "tls": {
          "issuerRef": "kuberploy-dns01-production",
          "mode": "letsencrypt",
          "redirectHttp": true
        }
      }
    ],
    "runtime": {
      "ports": [
        {
          "containerPort": 8080,
          "name": "http",
          "protocol": "TCP",
          "servicePort": 80
        }
      ],
      "probes": {
        "liveness": {
          "failureThreshold": 3,
          "httpGet": {
            "path": "/",
            "port": "http",
            "scheme": "HTTP"
          },
          "periodSeconds": 10,
          "timeoutSeconds": 2
        },
        "readiness": {
          "failureThreshold": 3,
          "httpGet": {
            "path": "/",
            "port": "http",
            "scheme": "HTTP"
          },
          "periodSeconds": 3,
          "timeoutSeconds": 2
        },
        "startup": {
          "failureThreshold": 30,
          "periodSeconds": 2,
          "tcpSocket": {
            "port": "http"
          },
          "timeoutSeconds": 1
        }
      },
      "replicas": 1,
      "resources": {
        "limits": {
          "cpu": "100m",
          "memory": "64Mi"
        },
        "requests": {
          "cpu": "10m",
          "memory": "16Mi"
        }
      },
      "strategy": {
        "type": "RollingUpdate"
      },
      "workloadType": "Deployment"
    }
  }
