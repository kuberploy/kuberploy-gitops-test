{
  "apiVersion": "config.kuberploy.io/v1alpha1",
  "kind": "AppConfig",
  "metadata": {
    "id": "83887cf6-bd8c-4715-868b-b19be9f50a2d",
    "name": "web"
  },
  "spec": {
    "applicationId": "83887cf6-bd8c-4715-868b-b19be9f50a2d",
    "delivery": {
      "mode": "image",
      "registryPull": {
        "profileName": "managed-main",
        "profileRevision": 1,
        "targetId": "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      },
      "release": {
        "digest": "sha256:12e7d9032557c5e33391a2e698b92f0d38e601ab287e791c0d3b9d5bba5050e2",
        "repository": "registry.adminchatmate.com/kuberploy-qualification/projects/f54740b2-e670-4993-b2e0-87286353bd31/services/83887cf6-bd8c-4715-868b-b19be9f50a2d/image"
      }
    },
    "environmentId": "2b047d5e-1cc8-4760-a081-879641fb7035",
    "projectId": "f54740b2-e670-4993-b2e0-87286353bd31",
    "runtime": {
      "ports": [
        {
          "containerPort": 8080,
          "name": "http",
          "protocol": "TCP",
          "servicePort": 80
        }
      ],
      "probes": {
        "liveness": {
          "failureThreshold": 3,
          "httpGet": {
            "path": "/",
            "port": "http",
            "scheme": "HTTP"
          },
          "periodSeconds": 10,
          "timeoutSeconds": 2
        },
        "readiness": {
          "failureThreshold": 3,
          "httpGet": {
            "path": "/",
            "port": "http",
            "scheme": "HTTP"
          },
          "periodSeconds": 3,
          "timeoutSeconds": 2
        },
        "startup": {
          "failureThreshold": 30,
          "periodSeconds": 2,
          "tcpSocket": {
            "port": "http"
          },
          "timeoutSeconds": 1
        }
      },
      "replicas": 2,
      "resources": {
        "limits": {
          "cpu": "100m",
          "memory": "64Mi"
        },
        "requests": {
          "cpu": "10m",
          "memory": "16Mi"
        }
      },
      "strategy": {
        "type": "RollingUpdate"
      },
      "workloadType": "Deployment"
    }
  }
}
