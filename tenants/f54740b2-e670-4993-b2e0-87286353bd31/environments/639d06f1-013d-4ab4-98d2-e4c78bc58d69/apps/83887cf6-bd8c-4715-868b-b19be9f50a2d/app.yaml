apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "83887cf6-bd8c-4715-868b-b19be9f50a2d"
  name: "web"
spec:
  projectId: "f54740b2-e670-4993-b2e0-87286353bd31"
  applicationId: "83887cf6-bd8c-4715-868b-b19be9f50a2d"
  environmentId: "639d06f1-013d-4ab4-98d2-e4c78bc58d69"
  delivery:
    mode: image
    registryPull:
      targetId: "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      profileName: "managed-main"
      profileRevision: 1
    release:
      repository: "registry.adminchatmate.com/kuberploy-qualification/projects/f54740b2-e670-4993-b2e0-87286353bd31/services/83887cf6-bd8c-4715-868b-b19be9f50a2d/image"
      digest: "sha256:94df3ca39475c03f899f8425e6da816a7901bc59df44bb449654ef5b0f7e2108"
  runtime:
    ports:
      -
        containerPort: 8080
        name: "http"
        protocol: "TCP"
        servicePort: 80
    probes:
      liveness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 10
        timeoutSeconds: 2
      readiness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 3
        timeoutSeconds: 2
      startup:
        failureThreshold: 30
        periodSeconds: 2
        tcpSocket:
          port: "http"
        timeoutSeconds: 1
    replicas: 1
    resources:
      limits:
        cpu: "100m"
        memory: "64Mi"
      requests:
        cpu: "10m"
        memory: "16Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"
