apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "8020e7bd-823c-43ce-9538-e56f80f0f1b3"
  name: "clone-lifecycle-app"
spec:
  projectId: "8066f318-b0d6-4ef0-85b5-8fafb10cc11f"
  applicationId: "8020e7bd-823c-43ce-9538-e56f80f0f1b3"
  environmentId: "d4a58c93-6c9c-4afe-be6b-889df1e6ecef"
  delivery:
    mode: image
    release:
      repository: "docker.io/library/nginx"
      digest: "sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3"
  runtime:
    args:
      - "-c"
      - "printf '%s\\n' 'worker_processes 1;' 'pid /tmp/clone-nginx.pid;' 'events { worker_connections 128; }' 'http { access_log /dev/stdout; error_log /dev/stderr warn; server { listen 8080; location / { return 200 \"clone lifecycle healthy\\n\"; } } }' >/tmp/clone-nginx.conf; exec nginx -c /tmp/clone-nginx.conf -g 'daemon off;'"
    command:
      - "/bin/sh"
    env:
      -
        name: "CLONE_QUALIFICATION"
        value: "source"
    ports:
      -
        containerPort: 8080
        name: "http"
        protocol: "TCP"
        servicePort: 80
    probes:
      readiness:
        failureThreshold: 10
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 3
        timeoutSeconds: 2
    replicas: 1
    resources:
      limits:
        cpu: "100m"
        memory: "64Mi"
      requests:
        cpu: "10m"
        memory: "16Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"
