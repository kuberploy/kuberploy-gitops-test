apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "c876d462-7ff0-4983-9d1e-7adae81187c5"
  name: "web"
spec:
  projectId: "bbdc9ba9-af3f-45c1-af6b-c04650eada8c"
  applicationId: "c876d462-7ff0-4983-9d1e-7adae81187c5"
  environmentId: "a7fdeec1-3c68-40cf-a4da-ce956a678208"
  delivery:
    mode: image
    registryPull:
      targetId: "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      profileName: "managed-main"
      profileRevision: 1
    release:
      repository: "registry.adminchatmate.com/kuberploy-qualification/projects/bbdc9ba9-af3f-45c1-af6b-c04650eada8c/services/c876d462-7ff0-4983-9d1e-7adae81187c5/image"
      digest: "sha256:39a5ce791410f83eff57014cc4736ebef86bd20189699847c5a6d6a0c96f0475"
  runtime:
    ports:
      -
        containerPort: 8080
        name: "http"
        protocol: "TCP"
        servicePort: 80
    probes:
      liveness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 10
        timeoutSeconds: 2
      readiness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 3
        timeoutSeconds: 2
      startup:
        failureThreshold: 30
        periodSeconds: 2
        tcpSocket:
          port: "http"
        timeoutSeconds: 1
    replicas: 1
    resources:
      limits:
        cpu: "100m"
        memory: "64Mi"
      requests:
        cpu: "10m"
        memory: "16Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"

