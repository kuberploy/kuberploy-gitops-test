apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "2b63b4b9-db58-4776-ad36-16b2d95833db"
  name: "state-normal"
spec:
  projectId: "55fa568d-9664-4118-871b-7e4df5cbbcf4"
  applicationId: "2b63b4b9-db58-4776-ad36-16b2d95833db"
  environmentId: "02972050-5095-4942-b845-0e9620677a39"
  delivery:
    mode: image
    release:
      repository: "docker.io/library/nginx"
      digest: "sha256:bd43d3d8fdbbe597c36fea489886796466a9ea5b662e8c50897d53e190c88a3d"
  runtime:
    args:
      - "-g"
      - "daemon off;"
    command:
      - "nginx"
    ports:
      -
        containerPort: 80
        name: "http"
        protocol: "TCP"
        servicePort: 80
    probes:
      readiness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 3
        timeoutSeconds: 2
    replicas: 1
    resources:
      limits:
        cpu: "100m"
        memory: "128Mi"
      requests:
        cpu: "10m"
        memory: "32Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"
