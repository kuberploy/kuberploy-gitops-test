{
  "apiVersion": "config.kuberploy.io/v1alpha1",
  "kind": "AppConfig",
  "metadata": {
    "id": "faede548-552f-4e49-a0fc-b1c139969635",
    "name": "web"
  },
  "spec": {
    "applicationId": "faede548-552f-4e49-a0fc-b1c139969635",
    "delivery": {
      "mode": "image",
      "registryPull": {
        "profileName": "managed-main",
        "profileRevision": 1,
        "targetId": "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      },
      "release": {
        "digest": "sha256:695bbe465cbc42a3e00505ea29c14e21f480a8be2aba19957adffd9d4b4cf85a",
        "repository": "registry.adminchatmate.com/kuberploy-qualification/projects/38e0b936-3e0f-46e1-89e4-74317f32a297/services/faede548-552f-4e49-a0fc-b1c139969635/image"
      }
    },
    "environmentId": "8815ff1f-0ca1-4358-81bd-e727cbc2e226",
    "projectId": "38e0b936-3e0f-46e1-89e4-74317f32a297",
    "runtime": {
      "ports": [
        {
          "containerPort": 8080,
          "name": "http",
          "protocol": "TCP",
          "servicePort": 80
        }
      ],
      "probes": {
        "liveness": {
          "failureThreshold": 3,
          "httpGet": {
            "path": "/",
            "port": "http",
            "scheme": "HTTP"
          },
          "periodSeconds": 10,
          "timeoutSeconds": 2
        },
        "readiness": {
          "failureThreshold": 3,
          "httpGet": {
            "path": "/",
            "port": "http",
            "scheme": "HTTP"
          },
          "periodSeconds": 3,
          "timeoutSeconds": 2
        }
      },
      "replicas": 1,
      "resources": {
        "limits": {
          "cpu": "250m",
          "memory": "128Mi"
        },
        "requests": {
          "cpu": "10m",
          "memory": "16Mi"
        }
      },
      "strategy": {
        "type": "RollingUpdate"
      },
      "workloadType": "Deployment"
    }
  }
}
