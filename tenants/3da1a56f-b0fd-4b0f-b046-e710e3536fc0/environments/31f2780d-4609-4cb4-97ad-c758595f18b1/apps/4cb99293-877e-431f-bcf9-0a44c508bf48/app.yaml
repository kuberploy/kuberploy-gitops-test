apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "4cb99293-877e-431f-bcf9-0a44c508bf48"
  name: "web"
spec:
  projectId: "3da1a56f-b0fd-4b0f-b046-e710e3536fc0"
  applicationId: "4cb99293-877e-431f-bcf9-0a44c508bf48"
  environmentId: "31f2780d-4609-4cb4-97ad-c758595f18b1"
  delivery:
    mode: image
    registryPull:
      targetId: "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      profileName: "managed-main"
      profileRevision: 1
    release:
      repository: "registry.adminchatmate.com/kuberploy-qualification/projects/3da1a56f-b0fd-4b0f-b046-e710e3536fc0/services/4cb99293-877e-431f-bcf9-0a44c508bf48/image"
      digest: "sha256:d00e9cf9f6159debf1863dcd3f10cd1770c27f2ba8693dae0d1d5b7381733b05"
  runtime:
    ports:
      -
        containerPort: 8080
        name: "http"
        protocol: "TCP"
        servicePort: 80
    probes:
      liveness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 10
        timeoutSeconds: 2
      readiness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 3
        timeoutSeconds: 2
      startup:
        failureThreshold: 30
        periodSeconds: 2
        tcpSocket:
          port: "http"
        timeoutSeconds: 1
    replicas: 1
    resources:
      limits:
        cpu: "100m"
        memory: "64Mi"
      requests:
        cpu: "10m"
        memory: "16Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"
