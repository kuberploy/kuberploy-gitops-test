{
  "apiVersion": "config.kuberploy.io/v1alpha1",
  "kind": "AppConfig",
  "metadata": {
    "id": "fb4ccf80-083e-4fc3-9570-b4d2f98fdae7",
    "name": "web"
  },
  "spec": {
    "applicationId": "fb4ccf80-083e-4fc3-9570-b4d2f98fdae7",
    "delivery": {
      "mode": "image",
      "registryPull": {
        "profileName": "managed-main",
        "profileRevision": 1,
        "targetId": "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      },
      "release": {
        "digest": "sha256:6670fe98d71e3d1e3dbbc24b0197ef47d00e57bb9cbc6e0023bbe4e0a5560d60",
        "repository": "registry.adminchatmate.com/kuberploy-qualification/projects/2bf6981d-7dd0-4349-8669-9da02ca32ea7/services/fb4ccf80-083e-4fc3-9570-b4d2f98fdae7/image"
      }
    },
    "environmentId": "acfd541b-412a-4125-af82-2e598e449e97",
    "projectId": "2bf6981d-7dd0-4349-8669-9da02ca32ea7",
    "routes": [
      {
        "dns": {
          "mode": "manual"
        },
        "host": "rc415-clone-acfd541b.adminchatmate.com",
        "id": "dns01",
        "ingressClassName": "traefik",
        "middlewareRefs": [],
        "path": "/",
        "port": "http",
        "tls": {
          "mode": "httpOnly"
        }
      }
    ],
    "runtime": {
      "ports": [
        {
          "containerPort": 8080,
          "name": "http",
          "protocol": "TCP",
          "servicePort": 80
        }
      ],
      "probes": {
        "liveness": {
          "failureThreshold": 3,
          "httpGet": {
            "path": "/",
            "port": "http",
            "scheme": "HTTP"
          },
          "periodSeconds": 10,
          "timeoutSeconds": 2
        },
        "readiness": {
          "failureThreshold": 3,
          "httpGet": {
            "path": "/",
            "port": "http",
            "scheme": "HTTP"
          },
          "periodSeconds": 3,
          "timeoutSeconds": 2
        },
        "startup": {
          "failureThreshold": 30,
          "periodSeconds": 2,
          "tcpSocket": {
            "port": "http"
          },
          "timeoutSeconds": 1
        }
      },
      "replicas": 2,
      "resources": {
        "limits": {
          "cpu": "100m",
          "memory": "64Mi"
        },
        "requests": {
          "cpu": "10m",
          "memory": "16Mi"
        }
      },
      "strategy": {
        "type": "RollingUpdate"
      },
      "workloadType": "Deployment"
    }
  }
}
