{
  "apiVersion": "config.kuberploy.io/v1alpha1",
  "kind": "AppConfig",
  "metadata": {
    "id": "a45f19a8-d332-4a4d-bdea-55cfabaa5c98",
    "name": "web-fixture"
  },
  "spec": {
    "applicationId": "a45f19a8-d332-4a4d-bdea-55cfabaa5c98",
    "delivery": {
      "mode": "image",
      "release": {
        "digest": "sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85",
        "repository": "registry.k8s.io/e2e-test-images/agnhost"
      }
    },
    "environmentId": "490637d0-88fa-40f0-8902-208a2f5aa6bd",
    "projectId": "0bc72c28-936f-4925-83f5-05a51d18f4bb",
    "runtime": {
      "args": [
        "netexec",
        "--http-port=8080",
        "--udp-port=-1"
      ],
      "command": [
        "/agnhost"
      ],
      "env": [
        {
          "name": "RC156_RUNTIME",
          "value": "staging-proof"
        }
      ],
      "ports": [
        {
          "containerPort": 8080,
          "name": "http",
          "protocol": "TCP",
          "servicePort": 80
        }
      ],
      "probes": {
        "liveness": {
          "failureThreshold": 3,
          "initialDelaySeconds": 2,
          "periodSeconds": 5,
          "tcpSocket": {
            "port": "http"
          },
          "timeoutSeconds": 1
        },
        "readiness": {
          "failureThreshold": 3,
          "periodSeconds": 2,
          "tcpSocket": {
            "port": "http"
          },
          "timeoutSeconds": 1
        },
        "startup": {
          "failureThreshold": 30,
          "periodSeconds": 1,
          "tcpSocket": {
            "port": "http"
          },
          "timeoutSeconds": 1
        }
      },
      "replicas": 1,
      "resources": {
        "limits": {
          "cpu": "300m",
          "memory": "160Mi"
        },
        "requests": {
          "cpu": "30m",
          "memory": "40Mi"
        }
      },
      "strategy": {
        "type": "RollingUpdate"
      },
      "terminationGracePeriodSeconds": 45,
      "workingDirectory": "/",
      "workloadType": "Deployment"
    }
  }
}
