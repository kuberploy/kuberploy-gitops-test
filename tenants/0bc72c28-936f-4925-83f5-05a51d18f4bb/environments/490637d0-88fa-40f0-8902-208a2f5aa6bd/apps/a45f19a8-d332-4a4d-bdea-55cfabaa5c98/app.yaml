{
  "apiVersion": "config.kuberploy.io/v1alpha1",
  "kind": "AppConfig",
  "metadata": {
    "id": "a45f19a8-d332-4a4d-bdea-55cfabaa5c98",
    "name": "web-fixture"
  },
  "spec": {
    "applicationId": "a45f19a8-d332-4a4d-bdea-55cfabaa5c98",
    "delivery": {
      "mode": "image",
      "release": {
        "digest": "sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85",
        "repository": "registry.k8s.io/e2e-test-images/agnhost"
      }
    },
    "environmentId": "490637d0-88fa-40f0-8902-208a2f5aa6bd",
    "middlewares": [
      {
        "name": "rc156-https-redirect",
        "spec": {
          "redirectScheme": {
            "permanent": true,
            "scheme": "https"
          }
        }
      },
      {
        "name": "rc159-basic-auth",
        "spec": {
          "basicAuth": {
            "removeHeader": true,
            "secretBindingRef": {
              "bindingId": "9217f871-d892-43dd-a97c-cf3564230972",
              "key": "users",
              "name": "rc159-basic-auth",
              "version": 2
            }
          }
        }
      },
      {
        "name": "redirect-scheme",
        "spec": {
          "redirectScheme": {
            "permanent": true,
            "scheme": "https"
          }
        }
      },
      {
        "name": "rc281-redirect-regex",
        "spec": {
          "redirectRegex": {
            "permanent": true,
            "regex": "^http://(.*)",
            "replacement": "https://1"
          }
        }
      },
      {
        "name": "rc281-add-prefix",
        "spec": {
          "addPrefix": {
            "prefix": "/api"
          }
        }
      },
      {
        "name": "rc281-strip-prefix",
        "spec": {
          "stripPrefix": {
            "forceSlash": false,
            "prefixes": [
              "/api"
            ]
          }
        }
      },
      {
        "name": "rc281-strip-prefix-regex",
        "spec": {
          "stripPrefixRegex": {
            "regex": [
              "^/api/[0-9]+"
            ]
          }
        }
      },
      {
        "name": "rc281-replace-path",
        "spec": {
          "replacePath": {
            "path": "/health"
          }
        }
      },
      {
        "name": "rc281-replace-path-regex",
        "spec": {
          "replacePathRegex": {
            "regex": "^/old/(.*)",
            "replacement": "/new/1"
          }
        }
      },
      {
        "name": "rc281-headers",
        "spec": {
          "headers": {
            "contentTypeNosniff": true,
            "customResponseHeaders": {
              "X-Kuberploy-Test": "rc281"
            },
            "frameDeny": true
          }
        }
      },
      {
        "name": "rc281-rate-limit",
        "spec": {
          "rateLimit": {
            "average": 100,
            "burst": 200,
            "period": "1s"
          }
        }
      },
      {
        "name": "rc281-in-flight",
        "spec": {
          "inFlightReq": {
            "amount": 50
          }
        }
      },
      {
        "name": "rc281-ip-allow-list",
        "spec": {
          "ipAllowList": {
            "sourceRange": [
              "10.0.0.0/8",
              "192.168.0.0/16"
            ]
          }
        }
      },
      {
        "name": "rc281-compress",
        "spec": {
          "compress": {
            "defaultEncoding": "gzip",
            "encodings": [
              "gzip",
              "br"
            ],
            "minResponseBodyBytes": 1024
          }
        }
      },
      {
        "name": "rc281-buffering",
        "spec": {
          "buffering": {
            "maxRequestBodyBytes": 1048576,
            "maxResponseBodyBytes": 1048576,
            "memRequestBodyBytes": 262144,
            "memResponseBodyBytes": 262144,
            "retryExpression": "IsNetworkError() \u0026\u0026 Attempts() \u003c 2"
          }
        }
      },
      {
        "name": "rc281-retry",
        "spec": {
          "retry": {
            "attempts": 3,
            "initialInterval": "100ms"
          }
        }
      }
    ],
    "projectId": "0bc72c28-936f-4925-83f5-05a51d18f4bb",
    "runtime": {
      "args": [
        "netexec",
        "--http-port=8080",
        "--udp-port=-1"
      ],
      "command": [
        "/agnhost"
      ],
      "env": [],
      "ports": [
        {
          "containerPort": 8080,
          "name": "http",
          "protocol": "TCP",
          "servicePort": 80
        }
      ],
      "replicas": 1,
      "resources": {
        "limits": {
          "cpu": "250m",
          "memory": "128Mi"
        },
        "requests": {
          "cpu": "25m",
          "memory": "32Mi"
        }
      },
      "strategy": {
        "type": "RollingUpdate"
      },
      "workingDirectory": "/",
      "workloadType": "Deployment"
    }
  }
}
