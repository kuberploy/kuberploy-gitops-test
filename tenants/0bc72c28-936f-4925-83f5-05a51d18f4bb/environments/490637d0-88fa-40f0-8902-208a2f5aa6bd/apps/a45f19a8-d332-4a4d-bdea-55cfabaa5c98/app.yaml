apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: a45f19a8-d332-4a4d-bdea-55cfabaa5c98
  name: web-fixture
spec:
  applicationId: a45f19a8-d332-4a4d-bdea-55cfabaa5c98
  delivery:
    mode: image
    release:
      digest: sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
      repository: registry.k8s.io/e2e-test-images/agnhost
  environmentId: 490637d0-88fa-40f0-8902-208a2f5aa6bd
  middlewares:
    - name: rc156-https-redirect
      spec:
        redirectScheme:
          permanent: true
          scheme: https
    - name: rc159-basic-auth
      spec:
        basicAuth:
          removeHeader: true
          secretBindingRef:
            bindingId: 9217f871-d892-43dd-a97c-cf3564230972
            key: users
            name: rc159-basic-auth
            version: 2
    - name: redirect-scheme
      spec:
        redirectScheme:
          permanent: true
          scheme: https
  projectId: 0bc72c28-936f-4925-83f5-05a51d18f4bb
  runtime:
    args:
      - netexec
      - --http-port=8080
      - --udp-port=-1
    command:
      - /agnhost
    env: []
    ports:
      - containerPort: 8080
        name: http
        protocol: TCP
        servicePort: 80
    replicas: 1
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
      requests:
        cpu: 25m
        memory: 32Mi
    strategy:
      type: Recreate
    workingDirectory: /
    workloadType: Deployment
    probes:
      startup:
        tcpSocket:
          port: http
        periodSeconds: 2
        timeoutSeconds: 1
        failureThreshold: 30
      readiness:
        httpGet:
          path: /
          port: http
          scheme: HTTP
        periodSeconds: 2
        timeoutSeconds: 1
        failureThreshold: 3
      liveness:
        httpGet:
          path: /
          port: http
          scheme: HTTP
        periodSeconds: 5
        timeoutSeconds: 1
        failureThreshold: 3
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/os
                  operator: In
                  values:
                    - linux
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 70
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: Exists
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  kuberploy.io/application: a45f19a8-d332-4a4d-bdea-55cfabaa5c98
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            kuberploy.io/application: a45f19a8-d332-4a4d-bdea-55cfabaa5c98
    tolerations:
      - key: qualification.kuberploy.io/workload
        operator: Equal
        value: application
        effect: PreferNoSchedule
    priorityClassName: kuberploy-rc293-runtime-test
