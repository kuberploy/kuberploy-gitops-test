{
  "apiVersion": "config.kuberploy.io/v1alpha1",
  "kind": "AppConfig",
  "metadata": {
    "id": "701d0422-a0c1-436d-8bc9-d40ec8c94eaf",
    "name": "runtime-dense-logs"
  },
  "spec": {
    "applicationId": "701d0422-a0c1-436d-8bc9-d40ec8c94eaf",
    "delivery": {
      "mode": "image",
      "release": {
        "digest": "sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3",
        "repository": "docker.io/library/nginx"
      }
    },
    "environmentId": "6e3e7058-368d-438a-9719-a66bb0b7bd46",
    "middlewares": [
      {
        "name": "headers",
        "profileRef": {
          "assignmentsDigest": "sha256:33f70be460aa77d99c32b654f003e0837f5229e6979072024845e3198d9a41e1",
          "profileId": "c27711fa-c8e0-4e15-96b5-183c128c10b9",
          "revision": 2,
          "specDigest": "sha256:e2acbb6682b138d7738036fa779ecffd523cf10324816396fee1003f97d786b0"
        },
        "spec": {
          "headers": {
            "contentTypeNosniff": true,
            "customResponseHeaders": {
              "X-Kuberploy-Qualification": "updated"
            },
            "frameDeny": true
          }
        }
      }
    ],
    "overrides": {
      "deployment": {
        "metadata": {
          "annotations": {
            "qualification.kuberploy.io/deployment": "rc455-runtime-20260913034244"
          }
        },
        "spec": {
          "replicas": 3,
          "revisionHistoryLimit": 4
        }
      },
      "ingress": {
        "metadata": {
          "annotations": {
            "external-dns.alpha.kubernetes.io/cloudflare-proxied": "false",
            "qualification.kuberploy.io/ingress": "rc455-runtime-20260913034244"
          }
        }
      },
      "service": {
        "metadata": {
          "annotations": {
            "qualification.kuberploy.io/service": "rc455-runtime-20260913034244"
          }
        },
        "spec": {
          "sessionAffinity": "ClientIP"
        }
      },
      "serviceAccount": {
        "metadata": {
          "annotations": {
            "eks.amazonaws.com/role-arn": "arn:aws:iam::123456789012:role/qualification",
            "qualification.kuberploy.io/identity": "rc455-runtime-20260913034244"
          }
        }
      }
    },
    "projectId": "2a9e74d1-ece3-4cad-918a-3054b6181d4c",
    "routes": [
      {
        "dns": {
          "integrationRef": "rc455-runtime-20260913034244",
          "mode": "externalDns",
          "ttl": 60
        },
        "host": "rc455-runtime-20260913034244.adminchatmate.com",
        "id": "configuration",
        "ingressClassName": "traefik",
        "middlewareRefs": [
          "headers"
        ],
        "path": "/",
        "port": "http",
        "tls": {
          "issuerRef": "rc460-http01-fresh-20260913034244",
          "mode": "letsencrypt",
          "redirectHttp": true
        }
      }
    ],
    "runtime": {
      "args": [
        "-c",
        "printf '%s\\n' 'worker_processes 1;' 'pid /tmp/runtime-nginx.pid;' 'events { worker_connections 128; }' 'http { access_log /dev/stdout; error_log /dev/stderr warn; server { listen 8080; location / { return 200 \"runtime fixture healthy\\n\"; } } }' \u003e/tmp/runtime-nginx.conf; awk 'BEGIN { for (i=1;i\u003c=12000;i++) printf \"RUNTIME_DENSE %08d %0500d\\n\", i, 0 }'; exec nginx -c /tmp/runtime-nginx.conf -g 'daemon off;'"
      ],
      "command": [
        "/bin/sh"
      ],
      "env": [],
      "ports": [
        {
          "containerPort": 8080,
          "name": "http",
          "protocol": "TCP",
          "servicePort": 80
        }
      ],
      "probes": {
        "readiness": {
          "failureThreshold": 10,
          "httpGet": {
            "path": "/",
            "port": "http",
            "scheme": "HTTP"
          },
          "periodSeconds": 3,
          "timeoutSeconds": 2
        }
      },
      "replicas": 2,
      "resources": {
        "limits": {
          "cpu": "110m",
          "memory": "64Mi"
        },
        "requests": {
          "cpu": "10m",
          "memory": "16Mi"
        }
      },
      "strategy": {
        "type": "RollingUpdate"
      },
      "workloadType": "Deployment"
    }
  }
}
