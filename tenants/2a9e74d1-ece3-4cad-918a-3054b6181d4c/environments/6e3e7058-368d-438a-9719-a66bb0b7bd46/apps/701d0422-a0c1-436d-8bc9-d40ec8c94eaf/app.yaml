{
  "apiVersion": "config.kuberploy.io/v1alpha1",
  "kind": "AppConfig",
  "metadata": { "id": "701d0422-a0c1-436d-8bc9-d40ec8c94eaf", "name": "runtime-dense-logs" },
  "spec":
    {
      "applicationId": "701d0422-a0c1-436d-8bc9-d40ec8c94eaf",
      "delivery":
        {
          "mode": "image",
          "release":
            {
              "digest": "sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f\
                1d3",
              "repository": "docker.io/library/nginx"
            }
        },
      "environmentId": "6e3e7058-368d-438a-9719-a66bb0b7bd46",
      "middlewares": [],
      "overrides":
        {
          "deployment":
            {
              metadata:
                {
                  annotations: { qualification.kuberploy.io/deployment: rc455-runtime-20260913034244 }
                },
              spec: { replicas: 3, revisionHistoryLimit: 4 }
            },
          "ingress":
            {
              metadata:
                {
                  annotations:
                    {
                      external-dns.alpha.kubernetes.io/cloudflare-proxied: "false",
                      qualification.kuberploy.io/ingress: rc455-runtime-20260913034244
                    }
                }
            },
          "service":
            {
              metadata:
                {
                  annotations: { qualification.kuberploy.io/service: rc455-runtime-20260913034244 }
                },
              spec: { sessionAffinity: ClientIP }
            },
          "serviceAccount":
            {
              metadata:
                {
                  annotations:
                    {
                      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/qualification,
                      qualification.kuberploy.io/identity: rc455-runtime-20260913034244
                    }
                }
            }
        },
      "projectId": "2a9e74d1-ece3-4cad-918a-3054b6181d4c",
      "routes":
        [
          {
              "dns": { mode: externalDns, integrationRef: rc455-runtime-20260913034244, ttl: 60 },
              "host": "rc455-runtime-20260913034244.adminchatmate.com",
              "id": "configuration",
              "ingressClassName": "traefik",
              "middlewareRefs": [],
              "path": "/",
              "port": "http",
              "tls":
                {
                  mode: letsencrypt,
                  issuerRef: rc460-http01-fresh-20260913034244,
                  redirectHttp: true
                }
            }
        ],
      "runtime":
        {
          "args":
            [
              -c,
              "printf '%s\\n' 'worker_processes 1;' 'pid
                /tmp/runtime-nginx.pid;' 'events { worker_connections 128; }'
                'http { access_log /dev/stdout; error_log /dev/stderr warn;
                server { listen 8080; location / { return 200 \"runtime fixture
                healthy\\n\"; } } }' >/tmp/runtime-nginx.conf; awk 'BEGIN { for
                (i=1;i<=12000;i++) printf \"RUNTIME_DENSE %08d %0500d\\n\", i, 0
                }'; exec nginx -c /tmp/runtime-nginx.conf -g 'daemon off;'"
            ],
          "command": [ /bin/sh ],
          "env": [],
          "ports": [ { name: http, containerPort: 8080, servicePort: 80, protocol: TCP } ],
          "probes":
            {
              readiness:
                {
                  httpGet: { path: /, port: http, scheme: HTTP },
                  periodSeconds: 3,
                  timeoutSeconds: 2,
                  failureThreshold: 10
                }
            },
          "replicas": 2,
          "resources":
            {
              "limits": { cpu: 110m, memory: 64Mi },
              "requests": { "cpu": "10m", "memory": "16Mi" }
            },
          "strategy": { "type": "RollingUpdate" },
          "workloadType": "Deployment"
        }
    }
}
