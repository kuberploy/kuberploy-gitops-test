apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "6825925f-bd6f-4e15-bc89-ab496fd60fb3"
  name: "web"
spec:
  projectId: "577a664d-08ee-42c8-a351-0b89163cbeb9"
  applicationId: "6825925f-bd6f-4e15-bc89-ab496fd60fb3"
  environmentId: "007dfc46-f2ac-4793-8967-9fb1274d87a0"
  delivery:
    mode: image
    registryPull:
      targetId: "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      profileName: "managed-main"
      profileRevision: 1
    release:
      repository: "registry.adminchatmate.com/kuberploy-qualification/projects/577a664d-08ee-42c8-a351-0b89163cbeb9/services/6825925f-bd6f-4e15-bc89-ab496fd60fb3/image"
      digest: "sha256:c16ff3d2850283004f9bdbb5c9ff0d701139d339376abe7fc763033c087caf30"
  runtime:
    ports:
      -
        containerPort: 8080
        name: "http"
        protocol: "TCP"
        servicePort: 80
    probes:
      liveness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 10
        timeoutSeconds: 2
      readiness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 3
        timeoutSeconds: 2
      startup:
        failureThreshold: 30
        periodSeconds: 2
        tcpSocket:
          port: "http"
        timeoutSeconds: 1
    replicas: 1
    resources:
      limits:
        cpu: "100m"
        memory: "64Mi"
      requests:
        cpu: "10m"
        memory: "16Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"
