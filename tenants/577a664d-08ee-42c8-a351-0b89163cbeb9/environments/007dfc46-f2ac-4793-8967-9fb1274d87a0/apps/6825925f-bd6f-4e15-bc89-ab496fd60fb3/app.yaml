{
  "apiVersion": "config.kuberploy.io/v1alpha1",
  "kind": "AppConfig",
  "metadata": {
    "id": "6825925f-bd6f-4e15-bc89-ab496fd60fb3",
    "name": "web"
  },
  "spec": {
    "applicationId": "6825925f-bd6f-4e15-bc89-ab496fd60fb3",
    "delivery": {
      "mode": "image",
      "registryPull": {
        "profileName": "managed-main",
        "profileRevision": 1,
        "targetId": "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      },
      "release": {
        "digest": "sha256:f0d8f12e7f357f09fad7ff62222e79bfb2c10ff6bce93ec972cb8139ffdef626",
        "repository": "registry.adminchatmate.com/kuberploy-qualification/projects/577a664d-08ee-42c8-a351-0b89163cbeb9/services/6825925f-bd6f-4e15-bc89-ab496fd60fb3/image"
      }
    },
    "environmentId": "007dfc46-f2ac-4793-8967-9fb1274d87a0",
    "projectId": "577a664d-08ee-42c8-a351-0b89163cbeb9",
    "runtime": {
      "ports": [
        {
          "containerPort": 8080,
          "name": "http",
          "protocol": "TCP",
          "servicePort": 80
        }
      ],
      "probes": {
        "liveness": {
          "failureThreshold": 3,
          "httpGet": {
            "path": "/",
            "port": "http",
            "scheme": "HTTP"
          },
          "periodSeconds": 10,
          "timeoutSeconds": 2
        },
        "readiness": {
          "failureThreshold": 3,
          "httpGet": {
            "path": "/",
            "port": "http",
            "scheme": "HTTP"
          },
          "periodSeconds": 3,
          "timeoutSeconds": 2
        },
        "startup": {
          "failureThreshold": 30,
          "periodSeconds": 2,
          "tcpSocket": {
            "port": "http"
          },
          "timeoutSeconds": 1
        }
      },
      "replicas": 1,
      "resources": {
        "limits": {
          "cpu": "100m",
          "memory": "64Mi"
        },
        "requests": {
          "cpu": "10m",
          "memory": "16Mi"
        }
      },
      "strategy": {
        "type": "RollingUpdate"
      },
      "workloadType": "Deployment"
    }
  }
}
