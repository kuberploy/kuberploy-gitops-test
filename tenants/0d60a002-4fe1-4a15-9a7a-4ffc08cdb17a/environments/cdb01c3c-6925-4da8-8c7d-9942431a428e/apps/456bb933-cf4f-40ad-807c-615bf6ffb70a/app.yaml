apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "456bb933-cf4f-40ad-807c-615bf6ffb70a"
  name: "private-oci"
spec:
  projectId: "0d60a002-4fe1-4a15-9a7a-4ffc08cdb17a"
  applicationId: "456bb933-cf4f-40ad-807c-615bf6ffb70a"
  environmentId: "cdb01c3c-6925-4da8-8c7d-9942431a428e"
  delivery:
    mode: image
    registryPull:
      targetId: "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      profileName: "managed-main"
      profileRevision: 1
    release:
      repository: "registry.adminchatmate.com/kuberploy-qualification/projects/0d60a002-4fe1-4a15-9a7a-4ffc08cdb17a/services/456bb933-cf4f-40ad-807c-615bf6ffb70a/image"
      digest: "sha256:5962120f34e1b8c8e951825ec3cbf58dd901437a8e095adc7040865265edb213"
  runtime:
    args:
      - "netexec"
      - "--http-port=8080"
    command:
      - "/agnhost"
    ports:
      -
        containerPort: 8080
        name: "http"
        protocol: "TCP"
        servicePort: 80
    probes:
      readiness:
        httpGet:
          path: "/hostname"
          port: "http"
        periodSeconds: 3
    replicas: 1
    resources:
      limits:
        cpu: "100m"
        memory: "128Mi"
      requests:
        cpu: "10m"
        memory: "32Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"
