{"apiVersion": "config.kuberploy.io/v1alpha1", "kind": "AppConfig", "metadata": {"id": "0898ce67-7697-4377-afac-2cd1ca459587", "name": "clone-lifecycle-app"}, "spec": {"applicationId": "0898ce67-7697-4377-afac-2cd1ca459587", "delivery": {"mode": "image", "release": {"digest": "sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3", "repository": "docker.io/library/nginx"}}, "environmentId": "745b9be2-aacb-44a4-87dc-5b912ebbabfa", "projectId": "c31b054d-ffe2-4394-8f94-50c7faa6a231", "runtime": {"args": ["-c", "printf '%s\\n' 'worker_processes 1;' 'pid /tmp/clone-nginx.pid;' 'events { worker_connections 128; }' 'http { access_log /dev/stdout; error_log /dev/stderr warn; server { listen 8080; location / { return 200 \"clone lifecycle healthy\\n\"; } } }' >/tmp/clone-nginx.conf; exec nginx -c /tmp/clone-nginx.conf -g 'daemon off;'"], "command": ["/bin/sh"], "env": [{"name": "CLONE_QUALIFICATION", "value": "edited-before-start"}, {"name": "CLONE_SECRET", "valueFrom": {"secretBindingRef": {"bindingId": "531bbeac-6caf-48c3-b9c5-00f1f75659a0", "name": "clone-secret", "key": "value", "version": 1}}}], "ports": [{"containerPort": 8080, "name": "http", "protocol": "TCP", "servicePort": 80}], "probes": {"readiness": {"failureThreshold": 10, "httpGet": {"path": "/", "port": "http", "scheme": "HTTP"}, "periodSeconds": 3, "timeoutSeconds": 2}}, "replicas": 2, "resources": {"limits": {"cpu": "100m", "memory": "64Mi"}, "requests": {"cpu": "10m", "memory": "16Mi"}}, "strategy": {"type": "RollingUpdate"}, "workloadType": "Deployment"}}}
