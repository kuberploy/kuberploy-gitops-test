apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "e8466062-962a-44a9-ac79-c799b84369df"
  name: "rc314-web"
spec:
  projectId: "c996a286-e587-4359-aaba-c5e16f14e518"
  applicationId: "e8466062-962a-44a9-ac79-c799b84369df"
  environmentId: "3ccdfa19-83ee-4f96-b094-40e49ac2c408"
  delivery:
    mode: image
    release:
      repository: "registry.k8s.io/e2e-test-images/agnhost"
      digest: "sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85"
