      - /agnhost
    ports:
      - name: http
        containerPort: 8080
        protocol: TCP
    replicas: 1
    resources:
      requests:
        cpu: "50m"
        memory: "100Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"
    env: []
  routes:
    - id: route-2c66e299b0
      host: "kuberploy-qualification.adminchatmate.com"
      path: "/"
      ingressClassName: "traefik"
      port: "http"
      tls:
        mode: letsencrypt
        issuerRef: kuberploy-dns01-production
        redirectHttp: true
      dns:
        mode: manual
      middlewareRefs: []
