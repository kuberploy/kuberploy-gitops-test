{
  "apiVersion": "config.kuberploy.io/v1alpha1",
  "kind": "AppConfig",
  "metadata": {
    "id": "f6b25925-da05-431c-b2d9-3f3de8cbccae",
    "name": "web"
  },
  "spec": {
    "applicationId": "f6b25925-da05-431c-b2d9-3f3de8cbccae",
    "delivery": {
      "mode": "image",
      "registryPull": {
        "profileName": "managed-main",
        "profileRevision": 1,
        "targetId": "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      },
      "release": {
        "digest": "sha256:0c9d580bde94b957cd033fe5ea8dfad43311a5f7fcfd7069568408874fa48024",
        "repository": "registry.adminchatmate.com/kuberploy-qualification/projects/4f12a4da-f574-40d3-ad03-4eb4c9fe3ce6/services/f6b25925-da05-431c-b2d9-3f3de8cbccae/image"
      }
    },
    "environmentId": "acda89f8-99da-4393-8cf9-f6593f4fe943",
    "projectId": "4f12a4da-f574-40d3-ad03-4eb4c9fe3ce6",
    "runtime": {
      "ports": [
        {
          "containerPort": 8080,
          "name": "http",
          "protocol": "TCP",
          "servicePort": 80
        }
      ],
      "probes": {
        "liveness": {
          "failureThreshold": 3,
          "httpGet": {
            "path": "/",
            "port": "http",
            "scheme": "HTTP"
          },
          "periodSeconds": 10,
          "timeoutSeconds": 2
        },
        "readiness": {
          "failureThreshold": 3,
          "httpGet": {
            "path": "/",
            "port": "http",
            "scheme": "HTTP"
          },
          "periodSeconds": 3,
          "timeoutSeconds": 2
        },
        "startup": {
          "failureThreshold": 30,
          "periodSeconds": 2,
          "tcpSocket": {
            "port": "http"
          },
          "timeoutSeconds": 1
        }
      },
      "replicas": 2,
      "resources": {
        "limits": {
          "cpu": "100m",
          "memory": "64Mi"
        },
        "requests": {
          "cpu": "10m",
          "memory": "16Mi"
        }
      },
      "strategy": {
        "type": "RollingUpdate"
      },
      "workloadType": "Deployment"
    }
  }
}
