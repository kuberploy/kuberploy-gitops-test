apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "5c961888-f506-4ccd-acd7-9956ffed91d3"
  name: "runtime-dense-logs"
spec:
  projectId: "4c3a7acc-d2e6-4150-9e20-ea2aa66e6a33"
  applicationId: "5c961888-f506-4ccd-acd7-9956ffed91d3"
  environmentId: "004ac701-0caf-46b9-9f3c-cd8bbcceb8a1"
  delivery:
    mode: image
    release:
      repository: "docker.io/library/nginx"
      digest: "sha256:bd43d3d8fdbbe597c36fea489886796466a9ea5b662e8c50897d53e190c88a3d"
  runtime:
    args:
      - "-c"
      - "printf '%s\\n' 'worker_processes 1;' 'pid /tmp/runtime-nginx.pid;' 'events { worker_connections 128; }' 'http { access_log /dev/stdout; error_log /dev/stderr warn; server { listen 8080; location / { return 200 \"runtime fixture healthy\\n\"; } } }' >/tmp/runtime-nginx.conf; awk 'BEGIN { for (i=1;i<=12000;i++) printf \"RUNTIME_DENSE %08d %0500d\\n\", i, 0 }'; exec nginx -c /tmp/runtime-nginx.conf -g 'daemon off;'"
    command:
      - "/bin/sh"
    ports:
      -
        containerPort: 8080
        name: "http"
        protocol: "TCP"
        servicePort: 80
    probes:
      readiness:
        failureThreshold: 10
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 3
        timeoutSeconds: 2
    replicas: 2
    resources:
      limits:
        cpu: "100m"
        memory: "64Mi"
      requests:
        cpu: "10m"
        memory: "16Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"
