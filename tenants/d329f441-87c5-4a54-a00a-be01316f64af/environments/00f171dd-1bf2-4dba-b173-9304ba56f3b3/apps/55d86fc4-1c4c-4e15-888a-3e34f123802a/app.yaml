          "specDigest": "sha256:d14434e638de9d64249cd217173a95fbad1dcde6297f8a6bf6742fc862d52c78"
        },
        "spec": {
          "headers": {
            "customResponseHeaders": {
              "X-Kuberploy-RC": "351"
            }
          }
        }
      }
    ],
    "projectId": "d329f441-87c5-4a54-a00a-be01316f64af",
    "routes": [
