        "path": "/",
        "port": "http",
        "tls": {
          "mode": "httpOnly"
        }
      }
    ],
    "runtime": {
      "args": [
        "netexec",
        "--http-port=8080",
        "--udp-port=-1",
        "--http-override=/echo?msg=rc345-appconfig"
