apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "55d86fc4-1c4c-4e15-888a-3e34f123802a"
  name: "oci"
spec:
  projectId: "d329f441-87c5-4a54-a00a-be01316f64af"
  applicationId: "55d86fc4-1c4c-4e15-888a-3e34f123802a"
  environmentId: "00f171dd-1bf2-4dba-b173-9304ba56f3b3"
  delivery:
    mode: image
    release:
      repository: "registry.k8s.io/e2e-test-images/agnhost"
      digest: "sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85"
  runtime:
    args:
      - "netexec"
      - "--http-port=8080"
      - "--udp-port=-1"
      - "--http-override=/echo?msg=rc345-appconfig"
    command:
      - "/agnhost"
    ports:
      - containerPort: 8080
        name: "http"
        protocol: "TCP"
        servicePort: 80
    replicas: 1
    resources:
      limits:
        cpu: "100m"
        memory: "64Mi"
      requests:
        cpu: "10m"
        memory: "16Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"
  overrides:
    deployment:
      metadata:
        annotations:
          qualification.kuberploy.io/deployment: rc351g
      spec:
        revisionHistoryLimit: 7
    service:
      metadata:
        annotations:
          qualification.kuberploy.io/service: rc351g
      spec:
        sessionAffinity: None
    ingress:
      metadata:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
          qualification.kuberploy.io/ingress: rc351g
    serviceAccount:
      metadata:
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/kuberploy-rc351g
  routes:
    - id: public
      host: kuberploy-qualification.adminchatmate.com
      path: /
      port: http
      ingressClassName: traefik
      dns:
        mode: externalDns
        integrationRef: rc351g-cloudflare
        ttl: 60
      tls:
        mode: letsencrypt
        issuerRef: kuberploy-letsencrypt-production
        redirectHttp: true
