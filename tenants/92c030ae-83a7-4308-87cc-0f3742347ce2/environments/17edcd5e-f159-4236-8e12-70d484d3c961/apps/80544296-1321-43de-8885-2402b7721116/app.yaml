apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "80544296-1321-43de-8885-2402b7721116"
  name: "ssh"
spec:
  projectId: "92c030ae-83a7-4308-87cc-0f3742347ce2"
  applicationId: "80544296-1321-43de-8885-2402b7721116"
  environmentId: "17edcd5e-f159-4236-8e12-70d484d3c961"
  delivery:
    mode: image
    registryPull:
      targetId: "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      profileName: "managed-main"
      profileRevision: 1
    release:
      repository: "registry.adminchatmate.com/kuberploy-qualification/projects/92c030ae-83a7-4308-87cc-0f3742347ce2/services/80544296-1321-43de-8885-2402b7721116/image"
      digest: "sha256:bf8270b4ac95ffbe354faf1d150e546117b63a0b467da61737318c51c14ee393"
  runtime:
    ports:
      -
        containerPort: 8080
        name: "http"
        protocol: "TCP"
        servicePort: 80
    probes:
      liveness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 10
        timeoutSeconds: 2
      readiness:
        failureThreshold: 3
        httpGet:
          path: "/"
          port: "http"
          scheme: "HTTP"
        periodSeconds: 3
        timeoutSeconds: 2
    replicas: 1
    resources:
      limits:
        cpu: "250m"
        memory: "128Mi"
      requests:
        cpu: "10m"
        memory: "16Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"
