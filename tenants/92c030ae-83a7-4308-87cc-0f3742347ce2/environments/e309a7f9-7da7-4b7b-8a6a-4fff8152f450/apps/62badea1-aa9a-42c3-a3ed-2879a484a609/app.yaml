apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "62badea1-aa9a-42c3-a3ed-2879a484a609"
  name: "ssh-project"
spec:
  projectId: "92c030ae-83a7-4308-87cc-0f3742347ce2"
  applicationId: "62badea1-aa9a-42c3-a3ed-2879a484a609"
  environmentId: "e309a7f9-7da7-4b7b-8a6a-4fff8152f450"
  delivery:
    mode: image
    registryPull:
      targetId: "f0b03740-c7a9-4ca0-a852-e807c97d2fc8"
      profileName: "managed-main"
      profileRevision: 1
    release:
      repository: "registry.adminchatmate.com/kuberploy-qualification/projects/92c030ae-83a7-4308-87cc-0f3742347ce2/services/62badea1-aa9a-42c3-a3ed-2879a484a609/image"
