{
  "apiVersion": "config.kuberploy.io/v1alpha1",
  "kind": "AppConfig",
  "metadata": {
    "id": "43203a58-d933-4b1c-9dce-667a000baf9c",
    "name": "oci"
  },
  "spec": {
    "applicationId": "43203a58-d933-4b1c-9dce-667a000baf9c",
    "delivery": {
      "mode": "image",
      "release": {
        "digest": "sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85",
        "repository": "registry.k8s.io/e2e-test-images/agnhost"
      }
    },
    "environmentId": "f7894ad1-a507-40ef-8ad1-bc26caba7f01",
    "overrides": {
      "deployment": {
        "spec": {
          "progressDeadlineSeconds": 10
        }
      }
    },
    "projectId": "0cb45bb7-0a1c-4415-aea1-35676429cd18",
    "runtime": {
      "args": [
        "netexec",
        "--http-port=8080",
        "--udp-port=-1",
        "--http-override=/echo?msg=development"
      ],
      "command": [
        "/agnhost"
      ],
      "env": [
        {
          "name": "RC405_ENVIRONMENT",
          "value": "development"
        }
      ],
      "ports": [
        {
          "containerPort": 8080,
          "name": "http",
          "protocol": "TCP",
          "servicePort": 80
        },
        {
          "containerPort": 9999,
          "name": "dead",
          "protocol": "TCP",
          "servicePort": 9999
        }
      ],
      "probes": {
        "liveness": {
          "failureThreshold": 3,
          "httpGet": {
            "path": "/echo?msg=live",
            "port": "http",
            "scheme": "HTTP"
          },
          "periodSeconds": 10,
          "timeoutSeconds": 2
        },
        "readiness": {
          "failureThreshold": 1,
          "periodSeconds": 1,
          "tcpSocket": {
            "port": "dead"
          },
          "timeoutSeconds": 1
        },
        "startup": {
          "failureThreshold": 30,
          "periodSeconds": 2,
          "tcpSocket": {
            "port": "http"
          },
          "timeoutSeconds": 1
        }
      },
      "replicas": 1,
      "resources": {
        "limits": {
          "cpu": "100m",
          "memory": "64Mi"
        },
        "requests": {
          "cpu": "10m",
          "memory": "16Mi"
        }
      },
      "strategy": {
        "type": "RollingUpdate"
      },
      "terminationGracePeriodSeconds": 20,
      "workingDirectory": "/",
      "workloadType": "Deployment"
    }
  }
}
