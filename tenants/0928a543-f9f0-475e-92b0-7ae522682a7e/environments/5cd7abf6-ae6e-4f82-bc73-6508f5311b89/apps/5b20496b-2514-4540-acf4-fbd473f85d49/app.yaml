apiVersion: config.kuberploy.io/v1alpha1
kind: AppConfig
metadata:
  id: "5b20496b-2514-4540-acf4-fbd473f85d49"
  name: "oci"
spec:
  projectId: "0928a543-f9f0-475e-92b0-7ae522682a7e"
  applicationId: "5b20496b-2514-4540-acf4-fbd473f85d49"
  environmentId: "5cd7abf6-ae6e-4f82-bc73-6508f5311b89"
  delivery:
    mode: image
    release:
      repository: "registry.k8s.io/e2e-test-images/agnhost"
      digest: "sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85"
  runtime:
    args:
      - "netexec"
      - "--http-port=8080"
      - "--udp-port=-1"
      - "--http-override=/echo?msg=rc331-appconfig"
    command:
      - "/agnhost"
    ports:
      -
        containerPort: 8080
        name: "http"
        protocol: "TCP"
        servicePort: 80
    replicas: 1
    resources:
      limits:
        cpu: "100m"
        memory: "64Mi"
      requests:
        cpu: "10m"
        memory: "16Mi"
    strategy:
      type: "RollingUpdate"
    workloadType: "Deployment"
