      "kuberploy.io/egress-config-ref": "cloudflare-egress-qualification",
      "kuberploy.io/provider-config-ref": "cloudflare-provider-qualification",
      "kuberploy.io/runtime-revision": "2"
    },
    "labels": {
      "app.kubernetes.io/managed-by": "kuberploy",
      "app.kubernetes.io/name": "external-dns",
      "app.kubernetes.io/version": "v0.21.0",
      "kuberploy.io/dns-integration": "8ca71fce-a2c1-4c47-b2f8-dcf88b7683e0"
    },
    "name": "external-dns-qualification-rc240",
    "namespace": "kuberploy-system"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "kuberploy.io/dns-integration": "8ca71fce-a2c1-4c47-b2f8-dcf88b7683e0"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/managed-by": "kuberploy",
          "app.kubernetes.io/name": "external-dns",
          "app.kubernetes.io/version": "v0.21.0",
          "kuberploy.io/dns-integration": "8ca71fce-a2c1-4c47-b2f8-dcf88b7683e0"
        }
      },
      "spec": {
        "containers": [
          {
            "args": [
              "--source=ingress",
              "--provider=cloudflare",
              "--registry=txt",
              "--policy=upsert-only",
              "--txt-owner-id=kuberploy-external-dns-qualification",
              "--label-filter=kuberploy.io/dns-integration=8ca71fce-a2c1-4c47-b2f8-dcf88b7683e0",
              "--domain-filter=adminchatmate.com"
            ],
            "env": [
              {
                "name": "CF_API_TOKEN",
                "valueFrom": {
                  "secretKeyRef": {
                    "key": "apiToken",
                    "name": "external-dns-cloudflare-qualification",
                    "optional": false
                  }
                }
              }
            ],
            "envFrom": [
              {
                "configMapRef": {
                  "name": "cloudflare-provider-qualification"
                }
              }
            ],
            "image": "registry.k8s.io/external-dns/external-dns@sha256:f53faaf71cb270d1ca9dce6ea0c94bfebf1a18696263487f0fbc74b9bf2bd7ff",
            "name": "external-dns",
            "resources": {
              "limits": {
                "cpu": "500m",
                "memory": "256Mi"
              },
              "requests": {
                "cpu": "25m",
                "memory": "64Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "readOnlyRootFilesystem": true,
              "runAsGroup": 65532,
              "runAsNonRoot": true,
              "runAsUser": 65532
            }
          }
        ],
        "securityContext": {
          "fsGroup": 65534,
          "runAsNonRoot": true,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "serviceAccountName": "kuberploy-external-dns-managed"
      }
    }
  }
}

