apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
    kuberploy.io/application: {{ .Values.applicationId | quote }}
    kuberploy.io/environment: {{ .Values.environmentId | quote }}
    kuberploy.io/project: {{ .Values.projectId | quote }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      kuberploy.io/application: {{ .Values.applicationId | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}
        kuberploy.io/application: {{ .Values.applicationId | quote }}
        kuberploy.io/environment: {{ .Values.environmentId | quote }}
        kuberploy.io/project: {{ .Values.projectId | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: registry.k8s.io/e2e-test-images/agnhost@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
          imagePullPolicy: IfNotPresent
          command: ["/agnhost"]
          args: ["netexec", "--http-port=8080", "--udp-port=-1", {{ printf "--http-override=%s" .Values.argumentValue | quote }}]
          env:
            - name: QUALIFICATION_VALUE
              value: {{ .Values.environmentValue | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
